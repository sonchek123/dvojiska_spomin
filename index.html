<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujemanje parov: dvojiško ↔ desetiško</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    #controls {
      margin-bottom: 1rem;
    }
    .pair-btn {
      padding: 0.5rem 1rem;
      margin: 0 0.25rem;
      border: 2px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .pair-btn.selected {
      border-color: #1e88e5;
      background-color: #e3f2fd;
      font-weight: bold;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      border: 2px solid #ccc;
      padding: 1.5rem;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s;
      background: #dddddd;
    }
    .card.flipped[data-type="bin"] {
      background: #e0f0ff;
    }
    .card.flipped[data-type="dec"] {
      background: #eeeeee;
    }
    .matched {
      background: #d4edda !important;
      color: #2e7d32;
      pointer-events: none;
    }
    #restartBtn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Ujemanje parov: dvojiško ↔ desetiško</h1>
  <div id="controls">
    <span>Izberi število parov:</span>
    <button class="pair-btn" data-pairs="5">5</button>
    <button class="pair-btn selected" data-pairs="10">10</button>
    <button class="pair-btn" data-pairs="15">15</button>
    <button onclick="startNewGame()">Začni igro</button>
  </div>
  <div id="game"></div>
  <p id="status"></p>
  <p id="counter">Število potez: 0</p>
  <button id="restartBtn" onclick="startNewGame()">Nova igra</button>

  <script>
    let selected = [];
    let matched = [];
    let moves = 0;
    let numPairs = 10;

    const status = document.getElementById('status');
    const counter = document.getElementById('counter');
    const restartBtn = document.getElementById('restartBtn');
    const pairButtons = document.querySelectorAll('.pair-btn');

    pairButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        pairButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        numPairs = parseInt(btn.dataset.pairs);
      });
    });

    function generatePairs(n) {
      const allNumbers = Array.from({ length: 15 }, (_, i) => i + 1);
      const chosen = shuffle(allNumbers).slice(0, n);
      const pairs = [];
      chosen.forEach(num => {
        const bin = num.toString(2).padStart(5, '0');
        pairs.push({ value: bin, type: 'bin', match: num.toString() });
        pairs.push({ value: num.toString(), type: 'dec', match: bin });
      });
      return shuffle(pairs);
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function renderGame() {
      const game = document.getElementById('game');
      game.innerHTML = '';
      const cards = generatePairs(numPairs);
      cards.forEach((card, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.dataset.value = card.value;
        div.dataset.type = card.type;
        div.dataset.match = card.match;
        div.dataset.index = index;
        div.textContent = '?';
        div.addEventListener('click', handleCardClick);
        game.appendChild(div);
      });
    }

    function handleCardClick(e) {
      const card = e.target;
      if (card.classList.contains('matched') || selected.includes(card)) return;

      card.textContent = card.dataset.value;
      card.classList.add('flipped');
      selected.push(card);

      if (selected.length === 2) {
        moves++;
        counter.textContent = `Število potez: ${moves}`;
        const [first, second] = selected;
        if (first.dataset.match === second.dataset.value && second.dataset.match === first.dataset.value) {
          first.classList.add('matched');
          second.classList.add('matched');
          matched.push(first, second);
          status.textContent = '✅ Pravilni par!';
        } else {
          status.textContent = '❌ Napačen par!';
          setTimeout(() => {
            first.textContent = '?';
            second.textContent = '?';
            first.classList.remove('flipped');
            second.classList.remove('flipped');
          }, 1000);
        }
        selected = [];
      }

      if (matched.length === numPairs * 2) {
        status.textContent = 'Našel si vse pare.';
        restartBtn.style.display = 'inline-block';
      }
    }

    function startNewGame() {
      matched = [];
      selected = [];
      moves = 0;
      counter.textContent = 'Število potez: 0';
      status.textContent = '';
      restartBtn.style.display = 'none';
      renderGame();
    }

    startNewGame();
  </script>
</body>
</html>
