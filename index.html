<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujemanje parov: dvojiško ↔ desetiško</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 1rem;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border: 2px solid #ccc;
      padding: 1.5rem;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s;
    }
    .matched {
      background: #d4edda;
      color: #2e7d32;
      pointer-events: none;
    }
    .flipped {
      background: #e3f2fd;
    }
  </style>
</head>
<body>
  <h1>🧠 Ujemanje parov: dvojiško ↔ desetiško</h1>
  <div id="game"></div>
  <p id="status"></p>

  <script>
    const numPairs = 6;
    let selected = [];
    let matched = [];
    const status = document.getElementById('status');

    function generatePairs(n) {
      const numbers = Array.from({ length: n }, (_, i) => i + 1);
      const pairs = [];
      numbers.forEach(num => {
        pairs.push({ value: num.toString(2), type: 'bin', match: num.toString() });
        pairs.push({ value: num.toString(), type: 'dec', match: num.toString(2) });
      });
      return shuffle(pairs);
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function renderGame() {
      const game = document.getElementById('game');
      game.innerHTML = '';
      const cards = generatePairs(numPairs);
      cards.forEach((card, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.dataset.value = card.value;
        div.dataset.type = card.type;
        div.dataset.match = card.match;
        div.dataset.index = index;
        div.textContent = '?';
        div.addEventListener('click', handleCardClick);
        game.appendChild(div);
      });
    }

    function handleCardClick(e) {
      const card = e.target;
      if (card.classList.contains('matched') || selected.includes(card)) return;

      card.textContent = card.dataset.value;
      card.classList.add('flipped');
      selected.push(card);

      if (selected.length === 2) {
        const [first, second] = selected;
        if (first.dataset.match === second.dataset.value && second.dataset.match === first.dataset.value) {
          first.classList.add('matched');
          second.classList.add('matched');
          matched.push(first, second);
          status.textContent = '✅ Pravilni par!';
        } else {
          status.textContent = '❌ Napačen par!';
          setTimeout(() => {
            first.textContent = '?';
            second.textContent = '?';
            first.classList.remove('flipped');
            second.classList.remove('flipped');
          }, 1000);
        }
        selected = [];
      }

      if (matched.length === numPairs * 2) {
        status.textContent = '🎉 Vse pare si našel!';
      }
    }

    renderGame();
  </script>
</body>
</html>
